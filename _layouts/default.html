<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} — {% endif %}Our Boighar | আমাদের বইঘর</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class' };
  if (localStorage.getItem('ob-theme') === 'dark') document.documentElement.classList.add('dark');
</script>
<style>
  body{font-family:'Hind Siliguri',system-ui,sans-serif}
  .serif{font-family:'Noto Serif Bengali',serif}
</style>
</head>
<body class="bg-[#faf3e7] text-[#26221c] dark:bg-neutral-900 dark:text-neutral-100 min-h-screen pb-24">

<header class="sticky top-0 z-20 bg-[#fffdf8]/95 dark:bg-neutral-900/95 backdrop-blur border-b border-[#eee2cd] dark:border-neutral-700">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-4">
    <a href="{{ '/' | relative_url }}" class="font-bold text-xl text-emerald-900 dark:text-emerald-300">📚 Our Boighar</a>
    <nav class="hidden sm:flex gap-5 text-[15px] font-semibold ml-2">
      <a href="{{ '/' | relative_url }}" class="hover:text-emerald-700">হোম</a>
      <a href="{{ '/' | relative_url }}#writers" class="hover:text-emerald-700">লেখক</a>
      <a href="{{ '/' | relative_url }}#categories" class="hover:text-emerald-700">বিষয়</a>
      <a href="{{ '/' | relative_url }}#popular" class="hover:text-emerald-700">জনপ্রিয় বই</a>
    </nav>
    <span class="flex-1"></span>
    <button id="theme-toggle" class="border border-[#e7dcc2] dark:border-neutral-600 rounded-full px-3 py-1 text-sm font-semibold" title="Dark mode">🌙</button>
    <span class="border border-[#e7dcc2] dark:border-neutral-600 rounded-full px-3 py-1 text-sm font-semibold text-neutral-500 dark:text-neutral-300">বাংলা</span>
  </div>
</header>

{{ content }}

<footer class="max-w-6xl mx-auto px-4 mt-14 pb-4 text-center text-sm text-neutral-500 dark:text-neutral-400">
  <p>© মোঃ তৌফিকুল ইসলাম · <a class="text-emerald-700 dark:text-emerald-400 font-semibold" href="https://towfiqulislam.gumroad.com/l/vvcbp">Gumroad</a> · <a class="text-emerald-700 dark:text-emerald-400 font-semibold" href="https://mdtowfiqul.github.io/Our-Days/">Our Days</a> · <a class="text-emerald-700 dark:text-emerald-400 font-semibold" href="https://github.com/MDTowfiqul">GitHub</a></p>
</footer>

<nav class="fixed bottom-0 left-0 right-0 z-20 bg-white dark:bg-neutral-900 border-t border-[#eee2cd] dark:border-neutral-700 flex justify-around py-2 text-xs font-semibold text-neutral-500 dark:text-neutral-400">
  <a href="{{ '/' | relative_url }}" class="flex flex-col items-center gap-0.5 px-3"><span class="text-xl">🏠</span>হোম</a>
  <a href="{{ '/' | relative_url }}#categories" class="flex flex-col items-center gap-0.5 px-3"><span class="text-xl">▦</span>বিষয়</a>
  <a href="{{ '/' | relative_url }}#searchbox" class="flex flex-col items-center gap-0.5 px-3"><span class="text-xl">🔍</span>খুঁজুন</a>
  <a href="{{ '/' | relative_url }}#shelf" class="flex flex-col items-center gap-0.5 px-3"><span class="text-xl">📖</span>আমার তাক</a>
</nav>

<script>
  document.getElementById('theme-toggle').addEventListener('click', function(){
    var on = document.documentElement.classList.toggle('dark');
    localStorage.setItem('ob-theme', on ? 'dark' : 'light');
    this.textContent = on ? '☀️' : '🌙';
  });
  if (document.documentElement.classList.contains('dark')) document.getElementById('theme-toggle').textContent = '☀️';
</script>
</body>
</html>
