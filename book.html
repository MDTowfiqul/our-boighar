<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book — Our Boighar</title>
<meta name="description" content="Book details on Our Boighar — read online or download.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&family=Noto+Serif+Bengali:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--green:#0d5c3f;--green-dark:#083f2b;--gold:#d4a24c;--cream:#faf3e7;--peach:#fdeee0;--ink:#26221c;--muted:#7a7264;--card:#fff;--line:#eee2cd;--accent:#c8501b}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Noto Sans",system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;padding-bottom:84px}
  .bn{font-family:"Noto Serif Bengali","Noto Sans",serif}
  a{color:var(--green);text-decoration:none}
  .topbar{position:sticky;top:0;z-index:10;background:#fffdf8;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 16px}
  .topbar a.back{font-weight:700;color:var(--ink)}
  .topbar .logo{font-weight:800;font-size:19px;color:var(--green-dark)}
  main{max-width:880px;margin:0 auto;padding:16px 16px 30px}
  .crumbs{color:var(--muted);font-size:13.5px;margin:2px 2px 14px}
  .hero{background:var(--peach);border:1px solid #f6ddc6;border-radius:18px;padding:22px;display:flex;gap:22px}
  .hero img{width:170px;border-radius:7px;box-shadow:0 8px 20px rgba(0,0,0,.2);align-self:flex-start}
  .hero .tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
  .tag{background:#fff;border:1px solid #f0d9bd;color:var(--accent);border-radius:999px;font-size:12px;font-weight:700;padding:3px 12px}
  .tag.fmt{color:var(--green-dark)}
  .hero h1{font-size:25px;line-height:1.4}
  .hero .en{font-size:15px;color:#4c463c;font-weight:600;margin-top:2px}
  .hero .who{margin-top:10px;font-size:14.5px}
  .hero .who a{font-weight:700}
  .hero .stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;color:#57503f;font-size:13.5px;font-weight:600}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;border-radius:12px;font-weight:700;font-size:15px;border:0;cursor:pointer;font:inherit}
  .btn.primary{background:var(--accent);color:#fff;grid-column:1/-1}
  .btn.primary:hover{filter:brightness(1.07)}
  .btn.light{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .btn.light.on{background:var(--gold);border-color:var(--gold);color:#fff}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:16px}
  .panel h2{font-size:18px;margin-bottom:10px}
  .panel p{font-size:15px;margin-bottom:10px;color:#38332a}
  .panel .tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
  table.info{width:100%;border-collapse:collapse;font-size:14.5px}
  table.info td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top}
  table.info tr:last-child td{border-bottom:0}
  table.info td.k{color:var(--muted);width:150px;font-weight:600}
  table.info td.v{font-weight:600}
  .dlrow{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
  .dlrow .fmt{background:#fdeee0;color:var(--accent);font-weight:800;border-radius:8px;padding:6px 10px;font-size:13px}
  .dlrow .grow{flex:1;font-size:14px}
  .dlrow .grow small{display:block;color:var(--muted)}
  .dlrow a{background:var(--green);color:#fff;border-radius:9px;padding:9px 16px;font-weight:700;font-size:14px}
  .note{font-size:13px;color:var(--muted);margin-top:10px}
  .more{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;margin-top:6px}
  .more a{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .more img{height:130px;width:auto;max-width:100%;border-radius:4px;box-shadow:0 4px 10px rgba(0,0,0,.18)}
  .more .mt{display:block;font-size:13px;font-weight:700;margin-top:8px;line-height:1.4;color:var(--ink)}
  .bnav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}
  .bnav a{font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 10px}
  .bnav a .ic{font-size:20px}
  .bnav a.on{color:var(--green)}
  .err{text-align:center;color:var(--muted);padding:70px 20px}
  @media (max-width:560px){.hero{flex-direction:column;align-items:center;text-align:left}.hero img{width:150px}.hero .who,.hero .stats{justify-content:flex-start}}
</style>
</head>
<body>

<header class="topbar">
  <a class="back" href="index.html">← Books</a>
  <span class="logo">📚 Our Boighar</span>
</header>

<main>
  <p class="crumbs" id="crumbs">Home / Books</p>
  <div id="content"><p class="err">Loading…</p></div>

  <section class="panel" id="comments-panel" style="display:none">
    <h2>💬 Reader comments &amp; reactions</h2>
    <p style="color:var(--muted);font-size:14px;margin-bottom:14px">Share your thoughts on this book — sign in with a free GitHub account.</p>
    <div id="giscus"></div>
  </section>
</main>

<nav class="bnav">
  <a href="index.html"><span class="ic">🏠</span>Home</a>
  <a href="index.html#books"><span class="ic">▦</span>Categories</a>
  <a href="index.html"><span class="ic">🔍</span>Search</a>
  <a href="index.html"><span class="ic">📖</span>My shelf</a>
</nav>

<script>
(function(){
  var BM_KEY = 'ourboighar-bookmarks';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function getBookmarks(){ try{ return JSON.parse(localStorage.getItem(BM_KEY)||'[]'); }catch(e){ return []; } }
  function setBookmarks(l){ try{ localStorage.setItem(BM_KEY, JSON.stringify(l)); }catch(e){} }

  var id = new URLSearchParams(location.search).get('id');
  var content = document.getElementById('content');

  fetch('books.json').then(function(r){ return r.json(); }).then(function(books){
    var b = null;
    books.forEach(function(x){ if(x.id === id) b = x; });
    if(!b){ content.innerHTML = '<p class="err">Book not found. <a href="index.html">Back to all books →</a></p>'; return; }
    document.title = b.title + ' — Our Boighar';
    document.getElementById('crumbs').textContent = 'Home / Books / ' + (b.titleEn || b.title);
    var bm = getBookmarks(), starred = bm.indexOf(b.id) >= 0;

    var statBits = [];
    statBits.push('🌐 ' + esc(b.languageLabel || b.language));
    statBits.push('📄 ' + esc(b.format || 'EPUB'));
    if(b.sizeMB) statBits.push('💾 ' + esc(b.sizeMB) + ' MB');
    if(b.year) statBits.push('🗓 First published ' + esc(b.year));

    var readBtn = '', dlBlock = '';
    if(b.file){
      readBtn = '<a class="btn primary" href="reader.html?file='+encodeURIComponent(b.file)+'&title='+encodeURIComponent(b.title)+'">📖 Read online</a>';
      dlBlock = '<div class="dlrow"><span class="fmt">'+esc(b.format||'EPUB')+'</span>'+
        '<span class="grow"><strong>'+(b.sizeMB ? esc(b.sizeMB)+' MB' : 'Ebook file')+'</strong><small>Direct download from Our Boighar</small></span>'+
        '<a href="'+esc(b.file)+'" download>Download</a></div>';
    } else if(b.gumroad){
      readBtn = '<a class="btn primary" href="'+esc(b.gumroad)+'" target="_blank" rel="noopener">🛒 Get it on Gumroad'+(b.price?' · '+esc(b.price):'')+'</a>';
      dlBlock = '<p class="note">This is a paid edition — the full ebook is delivered by Gumroad after purchase.</p>';
    }

    var tags = (b.categories||[]).map(function(c){ return '<span class="tag">'+esc(c)+'</span>'; }).join('') +
               '<span class="tag fmt">'+esc(b.format||'EPUB')+'</span>';

    var info = '';
    info += '<tr><td class="k">Writer</td><td class="v">'+esc(b.writer||'—')+'</td></tr>';
    info += '<tr><td class="k">Ebook creator</td><td class="v">'+esc(b.creator||'—')+'</td></tr>';
    info += '<tr><td class="k">Language</td><td class="v">'+esc(b.languageLabel||b.language)+'</td></tr>';
    info += '<tr><td class="k">Category</td><td class="v">'+esc((b.categories||[]).join(', ')||'—')+'</td></tr>';
    info += '<tr><td class="k">Format</td><td class="v">'+esc(b.format||'EPUB')+(b.file?' · read online or download':' · via Gumroad')+'</td></tr>';
    if(b.sizeMB) info += '<tr><td class="k">File size</td><td class="v">'+esc(b.sizeMB)+' MB</td></tr>';
    if(b.year) info += '<tr><td class="k">First published</td><td class="v">'+esc(b.year)+'</td></tr>';

    var more = books.filter(function(x){ return x.id !== b.id && x.writer && x.writer === b.writer; });
    var moreHtml = '';
    if(more.length){
      moreHtml = '<section class="panel"><h2>More by this writer</h2><div class="more">' +
        more.map(function(m){ return '<a href="book.html?id='+encodeURIComponent(m.id)+'"><img src="'+esc(m.cover)+'" alt=""><span class="mt bn">'+esc(m.title)+'</span></a>'; }).join('') +
        '</div></section>';
    }

    content.innerHTML =
      '<section class="hero"><img src="'+esc(b.cover)+'" alt="Cover of '+esc(b.titleEn||b.title)+'">'+
      '<div><div class="tags">'+tags+'</div>'+
      '<h1 class="bn">'+esc(b.title)+'</h1>'+
      (b.titleEn ? '<p class="en">'+esc(b.titleEn)+'</p>' : '')+
      '<p class="who">✍️ Writer: <a href="index.html">'+esc(b.writer||'—')+'</a></p>'+
      '<p class="who">📘 Ebook creator: '+esc(b.creator||'—')+'</p>'+
      '<div class="stats">'+statBits.join('') + '</div>'+
      '<div class="btns">'+ readBtn +
      (b.file ? '<a class="btn light" href="'+esc(b.file)+'" download>⬇ Download</a>' : '')+
      '<button class="btn light'+(starred?' on':'')+'" id="bm-btn">'+(starred?'★ On my shelf':'🔖 Add to shelf')+'</button>'+
      '<button class="btn light" id="share-btn">⤴ Share</button>'+
      '</div></div></section>'+

      '<section class="panel"><h2>About this book</h2><p>'+esc(b.description)+'</p><div class="tags">'+tags+'</div></section>'+

      '<section class="panel"><h2>Read or download</h2>'+ dlBlock +
      (b.file ? '<p class="note">Free book — you may read it online here, download it and share it.</p>' : '') + '</section>'+

      '<section class="panel"><h2>Book information</h2><table class="info">'+info+'</table></section>'+

      moreHtml;

    var bmBtn = document.getElementById('bm-btn');
    bmBtn.onclick = function(){
      var list = getBookmarks(), i = list.indexOf(b.id);
      if(i >= 0){ list.splice(i,1); bmBtn.classList.remove('on'); bmBtn.textContent = '🔖 Add to shelf'; }
      else { list.push(b.id); bmBtn.classList.add('on'); bmBtn.textContent = '★ On my shelf'; }
      setBookmarks(list);
    };
    document.getElementById('share-btn').onclick = function(){
      var url = location.href, t = b.title;
      if(navigator.share){ navigator.share({title:t, url:url}).catch(function(){}); }
      else if(navigator.clipboard){ navigator.clipboard.writeText(url); this.textContent = '✓ Link copied'; }
    };

    // per-book comments
    document.getElementById('comments-panel').style.display = 'block';
    var s = document.createElement('script');
    s.src = 'https://giscus.app/client.js';
    s.setAttribute('data-repo','MDTowfiqul/our-boighar');
    s.setAttribute('data-repo-id','R_kgDOVQa34Q');
    s.setAttribute('data-category','General');
    s.setAttribute('data-category-id','DIC_kwDOVQa34c4DJF-s');
    s.setAttribute('data-mapping','specific');
    s.setAttribute('data-term','book: ' + b.id);
    s.setAttribute('data-strict','0');
    s.setAttribute('data-reactions-enabled','1');
    s.setAttribute('data-emit-metadata','0');
    s.setAttribute('data-input-position','bottom');
    s.setAttribute('data-theme','preferred_color_scheme');
    s.setAttribute('data-lang','en');
    s.setAttribute('crossorigin','anonymous');
    s.async = true;
    document.getElementById('giscus').appendChild(s);
  }).catch(function(){ content.innerHTML = '<p class="err">Could not load this book.</p>'; });
})();
</script>
</body>
</html>
