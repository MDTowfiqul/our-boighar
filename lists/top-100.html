<main class="max-w-6xl mx-auto px-3 sm:px-4 mt-6">
  <p class="text-[13px] text-neutral-500 dark:text-neutral-400 mb-3">
    <a href="{{ '/' | relative_url }}" class="hover:underline" data-bn="হোম" data-en="Home">হোম</a> /
    <span class="font-semibold text-neutral-700 dark:text-neutral-200" data-bn="সেরা ১০০" data-en="Top 100">সেরা ১০০</span>
  </p>

  <div class="flex items-baseline justify-between flex-wrap gap-2">
    <h1 class="serif text-2xl sm:text-3xl font-semibold flex items-center gap-2"><svg class="ob-ic ob-ic-lg" aria-hidden="true"><use href="#ob-ic-award"/></svg><span data-bn="সেরা ১০০" data-en="Top 100">সেরা ১০০</span></h1>
    <a href="{{ '/' | relative_url }}?showcase=true" class="accent-text text-sm font-semibold hover:underline" data-bn="শোকেস দেখুন →" data-en="View showcase →">শোকেস দেখুন →</a>
  </div>
  <p class="text-sm text-neutral-500 dark:text-neutral-400 mt-1" data-bn="পাঠকদের সবচেয়ে বেশি পড়া ১০০টি বই — পাঠ-সংখ্যার ক্রমে" data-en="The 100 most-read books by our readers — in order of reads">পাঠকদের সবচেয়ে বেশি পড়া ১০০টি বই — পাঠ-সংখ্যার ক্রমে</p>

  <p id="top100-loading" class="text-sm text-neutral-500 dark:text-neutral-400 mt-7" data-bn="তালিকা লোড হচ্ছে…" data-en="Loading the list…">তালিকা লোড হচ্ছে…</p>
  <div id="top100-grid" class="grid grid-cols-[repeat(auto-fill,152px)] sm:grid-cols-[repeat(auto-fill,176px)] gap-4 sm:gap-5 mt-7"></div>
</main>

<script>
(function(){
  function lang(){ return window.__obLang || 'bn'; }
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  Promise.all([
    fetch('{{ "/search.json" | relative_url }}').then(function(r){ return r.ok ? r.json() : []; }),
    fetch('{{ "/popular.json" | relative_url }}', { cache:'no-cache' }).then(function(r){ return r.ok ? r.json() : {}; })
  ]).then(function(parts){
    var books = parts[0] || [], ranks = parts[1] || {};
    var top = books
      .filter(function(b){ return typeof ranks[b.book_id] === 'number'; })
      .sort(function(a, b){ return ranks[a.book_id] - ranks[b.book_id]; })
      .slice(0, 100);
    document.getElementById('top100-loading').remove();
    document.getElementById('top100-grid').innerHTML = top.map(function(b, i){
      var title = lang() === 'en' ? (b.title_en || b.title) : b.title;
      return '<a href="' + b.url + '" class="group">' +
        '<div class="relative rounded-xl overflow-hidden shadow bg-neutral-100 dark:bg-neutral-700 aspect-[2/3]">' +
        '<img src="' + b.cover + '" alt="' + esc(title) + '" class="w-full h-full object-cover transition-[filter] duration-200 group-hover:brightness-105">' +
        '<span class="absolute bottom-0.5 left-2 serif text-[42px] leading-none font-bold text-white" style="text-shadow:0 2px 8px rgba(0,0,0,.7)">' + window.__obDigits(i + 1) + '</span></div>' +
        '<h3 class="font-semibold text-sm sm:text-[15px] leading-snug min-h-[2.75em] mt-2 line-clamp-2 group-hover:text-emerald-700 dark:group-hover:text-emerald-400">' + esc(title) + '</h3>' +
        '<p class="text-xs text-neutral-500 dark:text-neutral-400 mt-0.5 line-clamp-1"><svg class="ob-ic ob-ic-sm" aria-hidden="true"><use href="#ob-ic-edit"/></svg> ' + esc(b.author) + '</p></a>';
    }).join('');
  }).catch(function(){
    document.getElementById('top100-loading').textContent = lang() === 'en' ? 'Could not load the list.' : 'তালিকা লোড করা যায়নি।';
  });
})();
</script>
